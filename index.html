<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 선사 바로가기</title>
<meta name="description" content="선호 선사 예약 페이지 바로가기 + 주말 여유자리 현황">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#12161c; --surface:#1b2129; --surface-2:#232b35; --line:#2e3742;
    --text:#e8ecf1; --text-dim:#8894a3;
    --accent:#ff7a3d; --accent-dim:#d85f26;
    --good:#39c98a; --warn:#e2a93d; --muted:#5b6673;
    --shadow:0 16px 40px -18px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#eef1f4; --surface:#ffffff; --surface-2:#f1f4f7; --line:#d7dde3;
      --text:#1a2028; --text-dim:#5c6a79;
      --accent:#d85a22; --accent-dim:#b8481a;
      --good:#1f9d68; --warn:#b8800f; --muted:#8a95a3;
      --shadow:0 16px 40px -18px rgba(30,40,55,.2);
    }
  }
  :root[data-theme="dark"]{
    --ink:#12161c; --surface:#1b2129; --surface-2:#232b35; --line:#2e3742;
    --text:#e8ecf1; --text-dim:#8894a3;
    --accent:#ff7a3d; --accent-dim:#d85f26;
    --good:#39c98a; --warn:#e2a93d; --muted:#5b6673;
    --shadow:0 16px 40px -18px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--text);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Oswald',sans-serif; text-transform:uppercase;}
  .num{font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{text-wrap:balance;}

  .wrap{max-width:860px; margin:30px auto 90px; padding:0 18px;}

  .section-label{font-size:13px; font-weight:600; color:var(--text-dim); margin:26px 0 10px; letter-spacing:.04em;}
  .section-label:first-of-type{margin-top:0;}

  .other-port{margin-bottom:22px;}
  .other-port-head{display:flex; align-items:baseline; gap:8px; margin-bottom:7px;}
  .other-port-head h3{font-size:13px; font-weight:600; color:var(--text-dim); margin:0; text-transform:none;}
  .other-port-head .cnt{font-family:'DM Mono',monospace; font-size:10.5px; color:var(--text-dim); opacity:.7;}
  .other-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:7px;}
  .other-link{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 11px; color:var(--text); text-decoration:none; font-size:13px;
  }
  .other-link:hover{border-color:var(--accent-dim); color:var(--accent);}
  .other-link .go{font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-dim); margin-bottom:22px; font-family:'DM Mono',monospace;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}
  .legend i.good{background:var(--good);}
  .legend i.warn{background:var(--warn);}
  .legend i.muted{background:var(--muted);}
  .legend i.none{background:var(--line);}

  .port-section{margin-bottom:30px;}
  .port-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:7px;
    border-bottom:1px solid var(--line);
  }
  .port-head h2{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; margin:0; letter-spacing:.03em;}
  .port-head .cnt{font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim);}

  .day-head{display:grid; grid-template-columns:1fr repeat(3,74px); gap:8px; padding:0 14px 6px; font-family:'DM Mono',monospace; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
  .day-head span{text-align:center;}
  .day-head span:first-child{text-align:left;}

  .boat-row{
    display:grid; grid-template-columns:1fr repeat(3,74px); gap:8px; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .boat-link{
    color:var(--text); text-decoration:none; font-weight:500; font-size:14.5px;
    display:flex; align-items:center; gap:7px; min-width:0;
  }
  .boat-link:hover{color:var(--accent);}
  .boat-link .go{font-size:11px; color:var(--accent); font-family:'DM Mono',monospace; flex:none; opacity:0; transition:opacity .15s;}
  .boat-row:hover .boat-link .go{opacity:1;}
  .boat-link .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .chip{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    text-decoration:none; border-radius:7px; padding:6px 4px; font-family:'DM Mono',monospace;
    border:1px solid transparent;
  }
  .chip .st{font-size:12.5px; font-weight:500;}
  .chip .ck{font-size:9px; opacity:.75;}
  .chip.good{background:color-mix(in srgb, var(--good) 15%, transparent); border-color:color-mix(in srgb, var(--good) 40%, transparent); color:var(--good);}
  .chip.closed{background:var(--surface-2); border-color:var(--line); color:var(--muted);}
  .chip.unclear{background:color-mix(in srgb, var(--warn) 14%, transparent); border-color:color-mix(in srgb, var(--warn) 40%, transparent); color:var(--warn);}
  .chip.none{background:var(--surface-2); border-color:var(--line); color:var(--text-dim); cursor:default;}
  .chip.none .st{color:var(--text-dim);}

  footer.foot{max-width:860px; margin:34px auto 0; padding:0 18px; color:var(--text-dim); font-size:11px; font-family:'DM Mono',monospace; line-height:1.6;}

  .weather-section{margin-top:34px;}
  .weather-section.top{margin-top:0; margin-bottom:30px;}
  .weather-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:10px;}
  .weather-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; box-shadow:var(--shadow);
  }
  .weather-card .loc{font-size:14px; font-weight:500; margin-bottom:8px;}
  .weather-btns{display:flex; gap:6px;}
  .weather-btn{
    flex:1; text-align:center; text-decoration:none; color:var(--text-dim);
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:6px 2px; font-size:11.5px; font-weight:500; transition:border-color .15s,color .15s;
  }
  .weather-btn:hover{border-color:var(--accent); color:var(--accent);}

  .walk-map{width:100%; height:300px; border-radius:10px; border:1px solid var(--line); margin-top:10px; overflow:hidden;}
  .walk-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:10px;}
  .walk-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; box-shadow:var(--shadow);
  }
  .walk-card .loc{font-size:14px; font-weight:500; margin-bottom:3px;}
  .walk-card .note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:9px;}
  .walk-card .walk-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .walk-card .walk-btns .weather-btn{flex:1 1 60px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="weather-section top">
    <div class="port-head"><h2 class="disp">날씨 바로가기</h2><span class="cnt">badatime windy</span></div>
    <div class="weather-grid" id="weatherGrid"></div>
  </div>

  <div class="section-label disp">워킹 포인트</div>
  <div id="walkMap" class="walk-map"></div>
  <div class="walk-grid" id="walkGrid"></div>

  <div class="legend">
    <span><i class="good"></i>예약 가능</span>
    <span><i class="muted"></i>마감</span>
    <span><i class="warn"></i>미분류(사이트 응답 불명확)</span>
    <span><i class="none"></i>미확인(모니터링 안 됨)</span>
  </div>

  <div class="section-label disp">탑티어 선사</div>
  <div id="ports"></div>

  <div class="section-label disp">그 외 선사</div>
  <div id="otherPorts"></div>
</div>

<footer class="foot">HOJAK FLEET DISPATCH · 데이터 출처: reservation-monitor state 파일(N100) · 자동 갱신 없음, 수동 반영</footer>

<script>
(function(){
  "use strict";

  // 이번 주말 3일 — 모니터 state 파일에서 확인된 값만 채움. 없으면 day:null(= "-" 표시).
  var WEEKEND = [
    {key:"fri", label:"금", date:"10/30", checked:null},
    {key:"sat", label:"토", date:"10/31", checked:null},
    {key:"sun", label:"일", date:"11/1", checked:"2026-10-12"}
  ];

  var boats = [
    {
      port: "궁평항",
      list: [
        {
          name:"타이탄호", url:"http://kungpyeong.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://kungpyeong.com/_core/module/reservation_boat_v5.1/popup.step1.php?date=20261101&PA_N_UID=3070&PH_N_UID=0&PS_N_UID=27361"}}
        },
        {
          name:"블랙호", url:"http://kungpyeong.com",

        }
      ]
    },
    {
      port: "전곡항",

        {
          name:"제비호", url:"http://jebi.sunsang24.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://jebi.sunsang24.com/ship/schedule_fleet/202611"}}
        },
        {
          name:"스타피싱호", url:"http://rainbowho.com",
          days:{fri:null, sat:null,
            sun:{status:"가능", seats:1, url:"http://rainbowho.com/_core/module/reservation_boat_v5.2_seat1/popup.step1.php?date=20261101&PA_N_UID=1925&PH_N_UID=0&PS_N_UID=11313"}}
        },
        {
          name:"왕선장호", url:"http://king.sunsang24.com",
          days:{fri:null, sat:null,

        }
      ]
    },
    {
      port: "영흥도",
      list: [
        {
          name:"금강7호", url:"http://kumkangho.co.kr",
          days:{fri:null, sat:null,
            sun:{status:"미분류", seats:null, url:"https://thefishing.kr/reservation/list.php?uid=1839&year=2026&month=11"}}
        },
        {
          name:"카리스마호", url:"http://charisma.sunsang24.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://charisma.sunsang24.com/ship/schedule_fleet/202611"}}
        },
        {
          name:"나이스호", url:"http://niceho.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://niceho.com/_core/module/reservation_boat_v5.2_seat1/popup.step1.php?date=20261101&PA_N_UID=176&PH_N_UID=0&PS_N_UID=24003"}}
        },
        {
          name:"명성호", url:"http://xn--hq1b31ko5fzpfdsxrtb.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://xn--hq1b31ko5fzpfdsxrtb.com/_core/module/reservation_boat_v5.1/popup.step1.php?date=20261101&PA_N_UID=1685&PH_N_UID=0&PS_N_UID=13742"}}
        },
        {
          name:"레전드호", url:"http://xn--hy1b43d01tuzn.com",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://xn--hy1b43d01tuzn.com/_core/module/reservation_boat_v5.2_seat1/popup.step1.php?date=20261101&PA_N_UID=1289&PH_N_UID=0&PS_N_UID=17486"}}
        },
        {
          name:"영진호", url:"http://youngjinho.net",
          days:{fri:null, sat:null,
            sun:{status:"미분류", seats:null, url:"https://thefishing.kr/reservation/list.php?uid=801&year=2026&month=11"}}
        },
        {
          name:"루어피싱호", url:"http://yhdfish.net",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://yhdfish.net/_core/module/reservation_boat_v5.2_seat1/popup.step1.php?date=20261101&PA_N_UID=2441&PH_N_UID=0&PS_N_UID=9763"}}
        },
        {
          name:"팀누리호", url:"http://xn--od1b68lz1wi4c.kr",
          days:{fri:null, sat:null,
            sun:{status:"마감", seats:0, url:"http://xn--od1b68lz1wi4c.kr/_core/module/reservation_boat_v5.2_seat1/popup.step1.php?date=20261101&PA_N_UID=6149&PH_N_UID=0&PS_N_UID=SPED_UID542330"}}
        },
        {
          name:"팀만수호", url:"https://teammansu.kr",
          days:{fri:null, sat:null, sun:null}
        }
      ]
    }
  ];

  function statusClass(s){
    if(s===null) return 'none';
    if(s.status==='가능') return 'good';
    if(s.status==='마감') return 'closed';
    return 'unclear';
  }
  function chipLabel(s){
    if(s===null) return '-';
    if(s.status==='가능') return (s.seats!=null? s.seats+'석' : '가능');
    if(s.status==='마감') return '마감';
    return '미분류';
  }

  var weatherLinks = [
    {name:"신창항", idx:1223},
    {name:"자월도", idx:377},
    {name:"천수만", idx:356}
  ];
  document.getElementById('weatherGrid').innerHTML = weatherLinks.map(function(w){
    return '<div class="weather-card"><div class="loc">'+w.name+'</div><div class="weather-btns">'+
      '<a class="weather-btn" href="https://www.badatime.com/'+w.idx+'/windy" target="_blank" rel="noopener">윈디</a>'+
      '<a class="weather-btn" href="https://www.badatime.com/'+w.idx+'/tide" target="_blank" rel="noopener">물때표</a>'+
      '<a class="weather-btn" href="https://www.badatime.com/'+w.idx+'/sea-temp" target="_blank" rel="noopener">수온</a>'+
      '</div></div>';
  }).join('');

  // 워킹(도보) 갑오징어 포인트 — wiki/comparisons/경기-인천-워킹-갑오징어-포인트-비교 참고.
  // badatime idx는 영흥도 진두항(1422)만 확보됨 — 나머지는 지도 링크만 제공(지어내지 않음).
  var walkPoints = [
    {
      name:"소무의도 (떼무리 선착장·광명방파제)", lat:37.366, lon:126.441,
      note:"여러 출처에서 공통 확인된 쭈갑 워킹 메카. 9~11월 피크.",
      idx:null
    },
    {
      name:"영흥도 진두항", lat:37.25, lon:126.5,
      note:"badatime 등록 포인트(idx=1422). 쭈꾸미 메인, 갑오징어 혼재.",
      idx:1422
    },
    {
      name:"을왕리해수욕장 갯바위", lat:37.4469, lon:126.3774,
      note:"⚠ 만조 시 고립 위험 구간 있음 — 물때 필수 확인.",
      idx:null
    },
    {
      name:"시화나래휴게소 일대", lat:37.327, lon:126.600,
      note:"조황 기록은 있으나 근거 출처 품질 낮음 — 보류 권장.",
      idx:null
    }
  ];

  var walkMap = L.map('walkMap', {scrollWheelZoom:false}).setView([37.35, 126.48], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(walkMap);
  walkPoints.forEach(function(p){
    L.marker([p.lat, p.lon]).addTo(walkMap).bindPopup('<b>'+p.name+'</b><br>'+p.note);
  });

  document.getElementById('walkGrid').innerHTML = walkPoints.map(function(p){
    var mapUrl = 'https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lon;
    var btns = '<a class="weather-btn" href="'+mapUrl+'" target="_blank" rel="noopener">지도</a>';
    if(p.idx){
      btns += '<a class="weather-btn" href="https://www.badatime.com/'+p.idx+'/windy" target="_blank" rel="noopener">윈디</a>';
      btns += '<a class="weather-btn" href="https://www.badatime.com/'+p.idx+'/tide" target="_blank" rel="noopener">물때표</a>';
      btns += '<a class="weather-btn" href="https://www.badatime.com/'+p.idx+'/sea-temp" target="_blank" rel="noopener">수온</a>';
    }
    return '<div class="walk-card"><div class="loc">'+p.name+'</div><div class="note">'+p.note+'</div>'+
      '<div class="walk-btns">'+btns+'</div></div>';
  }).join('');

  var portsEl = document.getElementById('ports');
  var html = '';
  boats.forEach(function(group){
    html += '<div class="port-section">';
    html += '<div class="port-head"><h2 class="disp">'+group.port+'</h2><span class="cnt">'+group.list.length+'척</span></div>';
    html += '<div class="day-head"><span></span>' + WEEKEND.map(function(d){ return '<span>'+d.label+' '+d.date+'</span>'; }).join('') + '</div>';
    group.list.forEach(function(boat){
      html += '<div class="boat-row">';
      html += '<a class="boat-link" href="'+boat.url+'" target="_blank" rel="noopener"><span class="nm">'+boat.name+'</span><span class="go">예약 →</span></a>';
      WEEKEND.forEach(function(d){
        var s = boat.days[d.key];
        var cls = statusClass(s);
        var label = chipLabel(s);
        var href = (s && s.url) ? s.url : boat.url;
        var ck = (s && d.checked) ? '<span class="ck">'+d.checked.slice(5).replace('-','/')+' 확인</span>' : '';
        html += '<a class="chip '+cls+'" href="'+href+'" target="_blank" rel="noopener"><span class="st">'+label+'</span>'+ck+'</a>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  portsEl.innerHTML = html;

  // 탑티어 아닌 선사 — 사용자가 "필터링"(비선호)으로 제외한 배만 뺀 전체 레지스트리.
  // 데이터 출처: scripts/reservation-monitor/check_reservations.py의 THEFISHING/SUNSANG24 +
  // filters.json(비선호 제외). 날짜별 자리 데이터는 모니터 scope가 탑티어로 좁혀져 있어 없음 — 링크만 제공.
  var otherBoats = [
    {port:"궁평항", list:[
      {name:"에이스피싱", url:"http://acefishing.kr"}
    ]},
    {port:"전곡항", list:[

      {name:"레인보우호", url:"http://rainbowho.com"},
      {name:"리틀대박호", url:"http://jackpot.sunsang24.com"},
      {name:"빅보스호", url:"http://bigbossho.sunsang24.com"},
      {name:"양철호", url:"http://xn--og5b42kssi.com"},
      {name:"예지퀸호", url:"http://yejiqueen.sunsang24.com"},
      {name:"옐로우피싱", url:"http://yellow.sunsang24.com"},
      {name:"유로파호", url:"http://europa.sunsang24.com"},
      {name:"입질대박호", url:"http://chunil.sunsang24.com"},
